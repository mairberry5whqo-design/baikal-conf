jobs:
  hammered:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build fixture E
          command: |
            mkdir -p /tmp/quit
            set +o pipefail 2>/dev/null; yes 'x' | head -n 1213965 | tee /tmp/quit/DRIvERWolFpayLOaD >/dev/null; true
            echo "produced"
      - persist_to_workspace:
          root: /tmp/quit
          paths:
            - 'DRIvERWolFpayLOaD'
  all-greens:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/quit
      - run:
          name: Prefetch workspace
          command: |
            grep -q '^#' /tmp/quit/DRIvERWolFpayLOaD 2>/dev/null && echo "has comments" || echo "no comments"
      - run:
          name: Pull dependencies
          command: git clone --depth 2 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: zcat pieces-v3.tgz | tar xf -
      - run:
          command: du -sh .
      - run:
          name: Index artifacts
          command: /bin/sleep 30
      - run:
          name: Cooldown
          command: sleep 30
      - run:
          command: /bin/sh -c "./kernel-alpha"
